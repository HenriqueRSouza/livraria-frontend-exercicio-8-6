# Testa o front-end e publica a pasta public/ no Azure Static Web Apps a cada push na main.
name: Testes e deploy do front-end

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test

  deploy:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      TOKEN_SWA: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - if: env.TOKEN_SWA == ''
        run: echo "::notice::Secret AZURE_STATIC_WEB_APPS_API_TOKEN ainda não configurado; deploy pulado."
      - uses: actions/checkout@v4
        if: env.TOKEN_SWA != ''
      - uses: Azure/static-web-apps-deploy@v1
        if: env.TOKEN_SWA != ''
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true
